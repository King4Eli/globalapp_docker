name: global_apps

services:
  global_redis:
    container_name: global_redis
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ._env/redis.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  redis_data:
