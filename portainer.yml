name: global_apps

services:
  global_portainer:
    container_name: global_portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    expose:
      - "8000"
      - "9443"
    ports:
      - "10.50.0.1:9010:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
