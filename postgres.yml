name: global_apps

services:
  global_postgres:
    image: postgres:16-alpine
    container_name: global_postgres
    env_file:
      - ._env/postgres.env
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "10.50.0.2:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: postgresql_db_data
